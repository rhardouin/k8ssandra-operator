{{- if or (not .Values.global.clusterScoped) .Values.global.clusterScopedResources }}
{{- $clusterScoped := .Values.global.clusterScoped }}
{{- $roleName := printf "%s-cass-operator-events" (include "k8ssandra-common.fullname" .) }}
apiVersion: rbac.authorization.k8s.io/v1
kind: {{ ternary "ClusterRole" "Role" $clusterScoped }}
metadata:
  name: {{ $roleName }}
  labels: {{ include "k8ssandra-common.labels" . | indent 4 }}
rules:
- apiGroups:
  - events.k8s.io
  resources:
  - events
  verbs:
  - create
  - patch
  - update
---
apiVersion: rbac.authorization.k8s.io/v1
kind: {{ ternary "ClusterRoleBinding" "RoleBinding" $clusterScoped }}
metadata:
  name: {{ $roleName }}
  labels: {{ include "k8ssandra-common.labels" . | indent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: {{ ternary "ClusterRole" "Role" $clusterScoped }}
  name: {{ $roleName }}
subjects:
- kind: ServiceAccount
  name: {{ include "k8ssandra-operator.cassOperatorServiceAccountName" . }}
  namespace: {{ .Release.Namespace }}
{{- end }}
